# Lancement de TomTroc avec sa base de données :
#   1. copier .env.example en .env et choisir les mots de passe
#   2. docker compose up -d --build
#   3. ouvrir http://localhost:8080/tomtroc/public/

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: tomtroc
      MARIADB_USER: ${DB_USER:?Définissez DB_USER dans le fichier .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Définissez DB_PASSWORD dans le fichier .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Définissez DB_ROOT_PASSWORD dans le fichier .env}
    volumes:
      # les données sont gardées entre deux redémarrages
      - db-data:/var/lib/mysql
      # au premier démarrage, MariaDB crée les tables et les données de démo
      - ./sql/tomtroc.sql:/docker-entrypoint-initdb.d/tomtroc.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      # port 8080 du PC -> port 8080 du conteneur (Apache ne tourne pas en root)
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_NAME: tomtroc
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      # les images envoyées par les membres sont gardées entre deux redémarrages
      - uploads:/var/www/html/tomtroc/public/uploads
    depends_on:
      # le site attend que la base soit prête avant de démarrer
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:
